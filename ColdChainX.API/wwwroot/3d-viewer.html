<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Load Plan Viewer - ColdChainX</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* Layout */
        .sidebar {
            position: absolute;
            top: 24px;
            left: 24px;
            width: 340px;
            background-color: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-header h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-header p {
            font-size: 11px;
            color: var(--text-muted);
        }

        .sidebar-content {
            padding: 20px;
            overflow: hidden;
        }

        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            background-color: var(--border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .loader {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message-box {
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .message-box.error {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .message-box.success {
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        /* Main View */
        .main-view {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            flex-direction: column;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-box {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .stat-box .value {
            font-size: 20px;
            font-weight: 700;
            color: var(--success);
            margin-bottom: 4px;
        }

        .stat-box.warning .value {
            color: var(--error);
        }

        .stat-box .label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .details-list {
            font-size: 12px;
            color: var(--text-muted);
            list-style: none;
            padding: 0;
        }

        .details-list li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .details-list li span:last-child {
            color: var(--text-main);
            font-weight: 500;
        }

        .package-panel {
            margin-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 14px;
        }

        .package-panel h2 {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .package-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 42vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .package-row {
            display: grid;
            grid-template-columns: 12px 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 9px 10px;
            background-color: rgba(15, 23, 42, 0.55);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            color: inherit;
            text-align: left;
        }

        .package-row.active {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.16);
        }

        .package-swatch {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .package-name {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .package-dims {
            display: block;
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .package-count {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
        }

        .canvas-container {
            position: absolute;
            left: 388px;
            top: 0;
            right: 0;
            bottom: 0;
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            transform: translate(-50%, -100%);
            margin-top: -10px;
            z-index: 20;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
        }

        .toolbox {
            position: absolute;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 8px;
            z-index: 12;
            background-color: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            backdrop-filter: blur(12px);
        }

        .tool-btn {
            width: 38px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.8);
            color: var(--text-main);
            font-size: 16px;
            cursor: pointer;
        }

        .tool-btn.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.25);
        }

        .selection-label {
            position: absolute;
            right: 24px;
            top: 78px;
            z-index: 12;
            max-width: 280px;
            color: var(--text-muted);
            background-color: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 12px;
            backdrop-filter: blur(8px);
        }
    </style>
</head>

<body>

    <!-- Split View: Left Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Kết Quả Xếp Xe 3D</h1>
            <p>Mô phỏng 3D thuật toán Packing LIFO.</p>
        </div>

        <div class="sidebar-content">
            <div id="msg-box" class="message-box"></div>

            <div id="results-panel">
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="value" id="res-util">0%</div>
                        <div class="label">Utilisation</div>
                    </div>
                    <div class="stat-box" id="unplaced-box">
                        <div class="value" id="res-unplaced">0</div>
                        <div class="label">Unplaced LPNs</div>
                    </div>
                </div>

                <ul class="details-list">
                    <li><span>Loại Xe:</span> <span id="res-type">-</span></li>
                    <li><span>Kích thước:</span> <span id="res-dims">-</span></li>
                    <li><span>Đã xếp:</span> <span id="res-placed">0 kiện</span></li>
                </ul>

                <div class="package-panel">
                    <h2>Packing trong don</h2>
                    <div class="package-list" id="package-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Split View: Right Main Area -->
    <div class="main-view">
        <div class="canvas-container">
            <canvas id="webgl-canvas"></canvas>
            <div class="toolbox">
                <button class="tool-btn active" id="tool-move" title="Move selected package">↔</button>
                <button class="tool-btn" id="tool-rotate" title="Rotate selected package">⟳</button>
                <button class="tool-btn" id="tool-snap" title="Toggle 5cm snap">⌗</button>
                <button class="tool-btn" id="tool-free" title="Allow moving outside truck">?</button>
            </div>
            <div class="selection-label" id="selection-label">Click a package to move or rotate it.</div>
            <div class="tooltip" id="tooltip"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        // Globals for 3D
        let scene, camera, renderer, controls, transformControls;
        let containerMesh, itemsGroup;
        let raycaster, mouse;
        let interactableMeshes = [];
        let selectedMesh = null;
        let currentPlan = null;
        let snapEnabled = true;
        let freeMoveEnabled = false;
        let activePackageKey = null;
        const tooltip = document.getElementById('tooltip');
        const selectionLabel = document.getElementById('selection-label');

        // Initialize
        initThreeJS();
        animate();
        checkUrlParamsAndSimulate();

        window.addEventListener('message', (event) => {
            if (event.data?.type !== 'COLDCHAINX_PACKING_PREVIEW') return;
            const plan = event.data.payload;
            if (!plan || !Array.isArray(plan.placedItems)) {
                showMessage("Dữ liệu mô phỏng không hợp lệ.", "error");
                return;
            }

            renderPlan(plan);
        });

        // Parse URL parameters and auto-simulate
        async function checkUrlParamsAndSimulate() {
            const urlParams = new URLSearchParams(window.location.search);
            const scheduleId = urlParams.get('scheduleId');
            const vId = urlParams.get('vehicleId');
            let lpnIdsRaw = urlParams.get('lpnIds');
            const embedded = urlParams.get('embedded') === '1';

            if (embedded) return;

            if (vId && lpnIdsRaw) {
                setTimeout(async () => {
                    const ids = lpnIdsRaw.split(',').map(id => id.trim()).filter(id => id);
                    await simulateFromUrl(scheduleId, vId, ids);
                }, 500);
            } else {
                showMessage("Vui lòng truyền scheduleId, vehicleId và lpnIds vào URL để xem 3D.", "error");
            }
        }

        async function simulateFromUrl(scheduleId, vehicleId, lpnIds) {
            try {
                const payload = { vehicleId, lpnIds };
                if (scheduleId) {
                    payload.scheduleId = scheduleId;
                }

                const response = await fetch('/api/Dispatch/simulate-packing?for3d=true', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok || !data.success) throw new Error(data.message || data.error || 'Failed to simulate');

                renderPlan(data.data);

            } catch (err) {
                showMessage(err.message, "error");
            }
        }

        function renderPlan(plan) {
            document.getElementById('res-util').textContent = Number(plan.utilisation || 0).toFixed(1) + '%';
            document.getElementById('res-unplaced').textContent = plan.unplacedLpnIds?.length || 0;
            document.getElementById('res-type').textContent = plan.vehicleType || '—';
            document.getElementById('res-dims').textContent = `${plan.containerWidth}x${plan.containerHeight}x${plan.containerLength} cm`;
            document.getElementById('res-placed').textContent = `${plan.placedItems.length} kiện`;

            const unplacedBox = document.getElementById('unplaced-box');
            if ((plan.unplacedLpnIds?.length || 0) > 0) {
                unplacedBox.classList.add('warning');
            } else {
                unplacedBox.classList.remove('warning');
            }

            preparePackageGroups(plan);
            drawPlan(plan);
            renderPackageGroups(plan);
        }

        function showMessage(text, type) {
            const box = document.getElementById('msg-box');
            box.className = `message-box ${type}`;
            box.textContent = text;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 5000);
        }

        // --- Three.js Implementation ---

        function initThreeJS() {
            const canvas = document.getElementById('webgl-canvas');
            const container = document.querySelector('.canvas-container');

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 5000);
            camera.position.set(400, 300, 500);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            transformControls = new TransformControls(camera, renderer.domElement);
            transformControls.setMode('translate');
            transformControls.setTranslationSnap(5);
            transformControls.setRotationSnap(Math.PI / 2);
            transformControls.addEventListener('dragging-changed', (event) => {
                controls.enabled = !event.value;
                if (!event.value && selectedMesh) {
                    clampSelectedMeshToContainer(selectedMesh);
                    updateSelectedItemFromMesh(selectedMesh);
                }
            });
            transformControls.addEventListener('objectChange', () => {
                if (selectedMesh) {
                    clampSelectedMeshToContainer(selectedMesh);
                    updateSelectedItemFromMesh(selectedMesh);
                }
            });
            scene.add(transformControls);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(200, 500, 300);
            scene.add(dirLight);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
            dirLight2.position.set(-200, 200, -300);
            scene.add(dirLight2);

            itemsGroup = new THREE.Group();
            scene.add(itemsGroup);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            canvas.addEventListener('mousemove', (event) => {
                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
                tooltip.style.left = event.clientX + 'px';
                tooltip.style.top = event.clientY + 'px';
            });

            canvas.addEventListener('pointerdown', (event) => {
                if (transformControls.dragging) return;

                const rect = container.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / container.clientWidth) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / container.clientHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactableMeshes);

                if (intersects.length > 0) {
                    selectMesh(intersects[0].object);
                }
            });

            document.getElementById('tool-move').addEventListener('click', () => setTransformMode('translate'));
            document.getElementById('tool-rotate').addEventListener('click', () => setTransformMode('rotate'));
            document.getElementById('tool-snap').addEventListener('click', () => {
                snapEnabled = !snapEnabled;
                transformControls.setTranslationSnap(snapEnabled ? 5 : null);
                transformControls.setRotationSnap(snapEnabled ? Math.PI / 2 : null);
                document.getElementById('tool-snap').classList.toggle('active', snapEnabled);
            });
            document.getElementById('tool-free').addEventListener('click', () => {
                freeMoveEnabled = !freeMoveEnabled;
                document.getElementById('tool-free').classList.toggle('active', freeMoveEnabled);
                selectionLabel.textContent = freeMoveEnabled
                    ? 'Free mode: packages can be moved outside the truck.'
                    : 'Bounded mode: packages stay inside the truck.';
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (interactableMeshes.length > 0) {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(interactableMeshes);

                if (intersects.length > 0) {
                    const data = intersects[0].object.userData;
                    tooltip.innerHTML = `<strong>${data.lpnCode}</strong><br>Dim: ${data.w}x${data.h}x${data.d} cm`;
                    tooltip.style.opacity = 1;
                    document.body.style.cursor = 'pointer';
                } else {
                    tooltip.style.opacity = 0;
                    document.body.style.cursor = 'default';
                }
            } else {
                tooltip.style.opacity = 0;
            }

            renderer.render(scene, camera);
        }

        function drawPlan(plan) {
            currentPlan = plan;
            selectedMesh = null;
            transformControls.detach();
            if (containerMesh) scene.remove(containerMesh);
            itemsGroup.clear();
            interactableMeshes = [];

            const cW = plan.containerWidth;
            const cH = plan.containerHeight;
            const cL = plan.containerLength;

            const boxGeo = new THREE.BoxGeometry(cW, cH, cL);
            const edges = new THREE.EdgesGeometry(boxGeo);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, linewidth: 2 });
            containerMesh = new THREE.LineSegments(edges, lineMat);
            containerMesh.position.set(cW / 2, cH / 2, cL / 2);
            scene.add(containerMesh);

            // 1. Evaporator (Lốc lạnh) at the Front (Cabin)
            const evapW = cW * 0.7;
            const evapH = Math.min(cH * 0.3, 60);
            const evapD = 30;
            const evapGeo = new THREE.BoxGeometry(evapW, evapH, evapD);
            const evapMat = new THREE.MeshPhongMaterial({ color: 0xcbd5e1 }); // Silver
            const evaporator = new THREE.Mesh(evapGeo, evapMat);
            evaporator.position.set(cW / 2, cH - evapH / 2 - 5, evapD / 2);
            itemsGroup.add(evaporator);

            // 2. Rear Doors (Cửa xe) at the Back
            const doorW = (cW / 2) - 2;
            const doorH = cH - 4;
            const doorD = 4;
            const doorGeo = new THREE.BoxGeometry(doorW, doorH, doorD);
            const doorMat = new THREE.MeshPhongMaterial({ color: 0x334155, transparent: true, opacity: 0.8 }); // Dark gray
            
            // Left Door
            const leftDoor = new THREE.Mesh(doorGeo, doorMat);
            leftDoor.position.set(doorW / 2 + 1, cH / 2, cL);
            const leftDoorEdges = new THREE.EdgesGeometry(doorGeo);
            leftDoor.add(new THREE.LineSegments(leftDoorEdges, new THREE.LineBasicMaterial({ color: 0xf87171 }))); // Red border
            itemsGroup.add(leftDoor);

            // Right Door
            const rightDoor = new THREE.Mesh(doorGeo, doorMat);
            rightDoor.position.set(cW - doorW / 2 - 1, cH / 2, cL);
            const rightDoorEdges = new THREE.EdgesGeometry(doorGeo);
            rightDoor.add(new THREE.LineSegments(rightDoorEdges, new THREE.LineBasicMaterial({ color: 0xf87171 }))); // Red border
            itemsGroup.add(rightDoor);

            const gridHelper = new THREE.GridHelper(Math.max(cW, cL) * 1.5, 20, 0x334155, 0x1e293b);
            gridHelper.position.set(cW / 2, 0, cL / 2);
            itemsGroup.add(gridHelper);

            plan.placedItems.forEach(item => {
                const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
                const colorHex = parseInt(item.color.replace('#', '0x'), 16) || 0x3b82f6;
                const mat = new THREE.MeshPhongMaterial({ color: colorHex, transparent: true, opacity: 0.85, shininess: 60 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(item.x + (item.w / 2), item.y + (item.h / 2), item.z + (item.d / 2));

                const itemEdges = new THREE.EdgesGeometry(geo);
                const itemEdgeMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
                mesh.add(new THREE.LineSegments(itemEdges, itemEdgeMat));

                mesh.userData = {
                    item,
                    lpnCode: item.lpnCode,
                    packageLabel: item.packageLabel,
                    packageKey: item.packageKey,
                    w: item.w,
                    h: item.h,
                    d: item.d
                };
                itemsGroup.add(mesh);
                interactableMeshes.push(mesh);
            });

            camera.position.set(cW * 1.5, cH * 1.5, cL * 1.5);
            controls.target.set(cW / 2, cH / 2, cL / 2);
            controls.update();
        }

        function setTransformMode(mode) {
            transformControls.setMode(mode);
            document.getElementById('tool-move').classList.toggle('active', mode === 'translate');
            document.getElementById('tool-rotate').classList.toggle('active', mode === 'rotate');
        }

        function selectMesh(mesh) {
            if (selectedMesh && selectedMesh.material?.emissive) {
                selectedMesh.material.emissive.setHex(0x000000);
            }

            selectedMesh = mesh;
            if (selectedMesh.material?.emissive) {
                selectedMesh.material.emissive.setHex(0x334155);
            }

            transformControls.attach(selectedMesh);
            const data = selectedMesh.userData;
            selectionLabel.textContent = `${data.packageLabel || data.lpnCode}: ${data.w} x ${data.h} x ${data.d} cm`;
            setActivePackage(data.packageKey);
        }

        function clampSelectedMeshToContainer(mesh) {
            if (!currentPlan || freeMoveEnabled) return;

            const halfX = mesh.userData.w / 2;
            const halfY = mesh.userData.h / 2;
            const halfZ = mesh.userData.d / 2;

            mesh.position.x = THREE.MathUtils.clamp(mesh.position.x, halfX, currentPlan.containerWidth - halfX);
            mesh.position.y = THREE.MathUtils.clamp(mesh.position.y, halfY, currentPlan.containerHeight - halfY);
            mesh.position.z = THREE.MathUtils.clamp(mesh.position.z, halfZ, currentPlan.containerLength - halfZ);
        }

        function updateSelectedItemFromMesh(mesh) {
            const item = mesh.userData.item;
            if (!item) return;

            item.x = Number((mesh.position.x - item.w / 2).toFixed(2));
            item.y = Number((mesh.position.y - item.h / 2).toFixed(2));
            item.z = Number((mesh.position.z - item.d / 2).toFixed(2));
            item.rotationY = Number(mesh.rotation.y.toFixed(4));
        }

        function preparePackageGroups(plan) {
            const groups = new Map();
            for (const item of plan.placedItems) {
                const label = item.packageLabel || item.lpnCode || 'Package';
                const key = `${label}|${item.w}|${item.h}|${item.d}|${item.color}`;
                item.packageKey = key;

                if (!groups.has(key)) {
                    groups.set(key, {
                        key,
                        label,
                        w: item.w,
                        h: item.h,
                        d: item.d,
                        color: item.color || '#3b82f6',
                        count: 0
                    });
                }

                groups.get(key).count += 1;
            }

            plan.packageGroups = Array.from(groups.values());
        }

        function renderPackageGroups(plan) {
            const list = document.getElementById('package-list');
            list.innerHTML = '';

            for (const group of plan.packageGroups || []) {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'package-row';
                row.dataset.packageKey = group.key;
                row.innerHTML = `
                    <span class="package-swatch" style="background:${escapeHtml(group.color)}"></span>
                    <span>
                        <span class="package-name">${escapeHtml(group.label)}</span>
                        <span class="package-dims">${group.w} x ${group.h} x ${group.d} cm</span>
                    </span>
                    <span class="package-count">x${group.count}</span>`;
                row.addEventListener('click', () => selectNextPackageInGroup(group.key));
                list.appendChild(row);
            }
        }

        function selectNextPackageInGroup(packageKey) {
            const meshes = interactableMeshes.filter(mesh => mesh.userData.packageKey === packageKey);
            if (meshes.length === 0) return;

            const currentIndex = selectedMesh ? meshes.indexOf(selectedMesh) : -1;
            const next = meshes[(currentIndex + 1) % meshes.length];
            selectMesh(next);
            focusCameraOnMesh(next);
        }

        function setActivePackage(packageKey) {
            activePackageKey = packageKey;

            document.querySelectorAll('.package-row').forEach(row => {
                row.classList.toggle('active', row.dataset.packageKey === packageKey);
            });

            for (const mesh of interactableMeshes) {
                if (!mesh.material) continue;
                const isActive = !packageKey || mesh.userData.packageKey === packageKey;
                mesh.material.opacity = isActive ? 0.88 : 0.32;
            }
        }

        function focusCameraOnMesh(mesh) {
            controls.target.copy(mesh.position);
            controls.update();
        }

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>

</html>
